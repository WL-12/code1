<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>陈大师 · 聊天室</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #e9e3d8;
      --muted: #aaa397;
      --paper: #201e1b;
      --panel: #2b2823;
      --accent: #bd8d4c;
      --accent-dark: #9c6d30;
      --line: rgba(233, 227, 216, .12);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Noto Serif SC", "Songti SC", Georgia, serif;
      color: var(--ink);
      background: radial-gradient(circle at 20% 0%, #4a3924 0, transparent 38rem), #161513;
    }
    .app { width: min(880px, 100%); min-height: 100vh; margin: auto; display: flex; flex-direction: column; }
    header { padding: 24px 24px 18px; border-bottom: 1px solid var(--line); background: rgba(32, 30, 27, .7); }
    h1 { margin: 0; font-size: 1.35rem; font-weight: 600; letter-spacing: .12em; }
    header p { margin: 7px 0 0; color: var(--muted); font-size: .9rem; }
    #messages { flex: 1; padding: 24px; overflow-y: auto; }
    .message { display: flex; gap: 11px; margin: 0 0 20px; max-width: 82%; }
    .message.user { margin-left: auto; flex-direction: row-reverse; }
    .avatar { flex: 0 0 32px; width: 32px; height: 32px; border: 1px solid var(--accent); border-radius: 50%; display: grid; place-items: center; color: #f4d29d; font-size: .8rem; }
    .user .avatar { border-color: #74706a; color: var(--muted); }
    .bubble { padding: 12px 15px; border-radius: 4px 15px 15px 15px; background: var(--panel); line-height: 1.7; white-space: pre-wrap; word-break: break-word; }
    .user .bubble { border-radius: 15px 4px 15px 15px; background: #574022; }
    .typing { color: var(--muted); font-style: italic; }
    form { display: flex; gap: 10px; padding: 16px 24px 24px; border-top: 1px solid var(--line); background: rgba(32, 30, 27, .8); }
    textarea { flex: 1; min-height: 50px; max-height: 150px; resize: vertical; padding: 13px; border: 1px solid var(--line); border-radius: 8px; outline: none; background: #181715; color: var(--ink); font: inherit; line-height: 1.45; }
    textarea:focus { border-color: var(--accent); }
    button { align-self: flex-end; min-height: 50px; padding: 0 20px; border: 0; border-radius: 8px; cursor: pointer; background: var(--accent); color: #21170b; font: inherit; font-weight: 700; }
    button:hover { background: #d1a45d; }
    button:disabled { cursor: wait; opacity: .55; }
    @media (max-width: 560px) { #messages { padding: 18px 14px; } form { padding: 12px 14px 16px; } .message { max-width: 92%; } }
  </style>
</head>
<body>
  <main class="app">
    <header><h1>陈大师</h1><p>命里有时终须有，命里无时莫强求。</p></header>
    <section id="messages" aria-live="polite">
      <article class="message"><div class="avatar">陈</div><div class="bubble">老夫在此。请问阁下想问些什么？</div></article>
    </section>
    <form id="chat-form">
      <textarea id="query" aria-label="输入消息" placeholder="输入你的问题，按 Enter 发送（Shift + Enter 换行）" required></textarea>
      <button id="send" type="submit">发送</button>
    </form>
  </main>
  <script>
    const form = document.querySelector('#chat-form');
    const query = document.querySelector('#query');
    const messages = document.querySelector('#messages');
    const send = document.querySelector('#send');

    function addMessage(text, role, extraClass = '') {
      const item = document.createElement('article');
      item.className = `message ${role} ${extraClass}`;
      const avatar = document.createElement('div');
      avatar.className = 'avatar';
      avatar.textContent = role === 'user' ? '我' : '陈';
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = text;
      item.append(avatar, bubble);
      messages.appendChild(item);
      messages.scrollTop = messages.scrollHeight;
      return item;
    }

    async function sendMessage() {
      const text = query.value.trim();
      if (!text || send.disabled) return;
      addMessage(text, 'user');
      query.value = '';
      send.disabled = true;
      const waiting = addMessage('陈大师正在推演……', 'assistant', 'typing');
      try {
        const response = await fetch(`/chat?query=${encodeURIComponent(text)}`, { method: 'POST' });
        if (!response.ok) throw new Error(`服务器返回 ${response.status}`);
        const data = await response.json();
        waiting.remove();
        addMessage(data.output || '老夫暂时未能得出答复，请稍后再试。', 'assistant');
      } catch (error) {
        waiting.remove();
        addMessage(`请求未能完成：${error.message}。请确认后端服务已启动。`, 'assistant');
      } finally {
        send.disabled = false;
        query.focus();
      }
    }

    form.addEventListener('submit', (event) => { event.preventDefault(); sendMessage(); });
    query.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); sendMessage(); }
    });
  </script>
</body>
</html>
